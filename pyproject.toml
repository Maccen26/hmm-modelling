[project]
name = "hmm-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dotenv>=0.9.9",
    "equinox>=0.13.7",
    "holidays>=0.105",
    "jax>=0.9.0.1",
    "matplotlib>=3.10.8",
    "numpy>=1.23.5,<2.3",
    "openpyxl>=3.1.5",
    "optax>=0.2.8",
    "optuna>=5.0.0",
    "pandas>=3.0.0",
    "r-models",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "sympy>=1.14.0",
]

[tool.setuptools]
packages = ["src", "drivers"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
r-models = { workspace = true, editable = false }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
