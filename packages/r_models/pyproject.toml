[project]
name = "r-models"
version = "0.1.0"
description = "R model wrappers (rpy2) for the HMM special course"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "rpy2>=3.6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["r_models"]
